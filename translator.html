<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator — miyazawa-workspace</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #c9c2a8;
    --paper: #ece6cf;
    --ink: #15161a;
    --ink-dim: #5c5a52;
    --accent: #E86020;
    --border: #b8b09a;
    --radius: 4px;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Password Gate ── */
  #gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #gate.hidden { display: none; }

  .gate-box {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 48px;
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .gate-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
  }
  .gate-subtitle {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    margin-top: -12px;
  }
  .gate-input {
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--ink);
    outline: none;
    letter-spacing: 0.1em;
    width: 100%;
  }
  .gate-input:focus { border-color: var(--ink); }
  .gate-input.error { border-color: #c0392b; }
  .gate-btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 10px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
  }
  .gate-btn:hover { background: var(--accent); }
  .gate-error {
    font-size: 11px;
    color: #c0392b;
    letter-spacing: 0.04em;
    min-height: 16px;
  }

  /* ── Header ── */
  header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header a { font-size: 12px; color: var(--ink-dim); text-decoration: none; letter-spacing: 0.05em; }
  header a:hover { color: var(--accent); }
  .site-title { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-dim); }
  .page-title { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
  .logout-btn {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--ink-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .logout-btn:hover { border-color: var(--ink); color: var(--ink); }

  /* ── Main ── */
  main {
    flex: 1;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  /* ── Lang selector ── */
  .lang-row { display: flex; align-items: center; gap: 12px; }
  .lang-group { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .lang-btn {
    padding: 6px 16px;
    background: var(--paper);
    border: none;
    border-right: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .lang-btn:last-child { border-right: none; }
  .lang-btn.active { background: var(--ink); color: var(--bg); }
  .lang-btn:hover:not(.active) { background: var(--border); color: var(--ink); }

  .swap-btn {
    width: 32px; height: 32px;
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); transition: all 0.15s; flex-shrink: 0;
  }
  .swap-btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .arrow { color: var(--ink-dim); font-size: 13px; letter-spacing: 0.03em; }

  /* ── Panels ── */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; }
  .panel-label { padding: 8px 14px; font-size: 10px; letter-spacing: 0.12em; color: var(--ink-dim); border-bottom: 1px solid var(--border); text-transform: uppercase; }
  textarea {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    padding: 14px; font-family: var(--mono); font-size: 15px; line-height: 1.7;
    color: var(--ink); min-height: 200px;
  }
  textarea::placeholder { color: var(--border); }
  #outputText { color: #2a4a2a; }

  .panel-footer { padding: 8px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .char-count { font-size: 11px; color: var(--ink-dim); }
  .copy-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    padding: 3px 10px; background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--ink-dim); cursor: pointer; transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .copy-btn.copied { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Action row ── */
  .action-row { display: flex; align-items: center; gap: 16px; }
  .translate-btn {
    font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    padding: 10px 28px; background: var(--ink); color: var(--bg);
    border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.15s;
  }
  .translate-btn:hover { background: var(--accent); }
  .translate-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .translate-btn:disabled:hover { background: var(--ink); }

  .status { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.03em; }
  .status.loading { color: var(--accent); }
  .status.error { color: #c0392b; }
  .status.ok { color: #2a7a2a; }

  /* ── Footer ── */
  footer { padding: 16px 32px; border-top: 1px solid var(--border); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.04em; }

  @media (max-width: 640px) {
    main { padding: 16px; }
    .panels { grid-template-columns: 1fr; }
    textarea { min-height: 140px; }
    header { padding: 14px 16px; flex-wrap: wrap; }
    footer { padding: 12px 16px; }
    .gate-box { width: 90%; padding: 32px 24px; }
  }
</style>
</head>
<body>

<!-- ── Password Gate ── -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-title">TRANSLATOR</div>
    <div class="gate-subtitle">miyazawa-workspace · private access</div>
    <input type="password" id="pwInput" class="gate-input" placeholder="Enter access key…" autocomplete="current-password" />
    <div class="gate-error" id="gateError"></div>
    <button class="gate-btn" id="gateBtn">ENTER →</button>
  </div>
</div>

<!-- ── App ── -->
<header>
  <span class="site-title"><a href="/">MIYAZAWA-WORKSPACE</a></span>
  <span style="color:var(--border)">·</span>
  <span class="page-title">TRANSLATOR</span>
  <button class="logout-btn" id="logoutBtn">LOCK</button>
</header>

<main>
  <div class="lang-row">
    <div class="lang-group" id="srcGroup">
      <button class="lang-btn active" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
    <button class="swap-btn" id="swapBtn" title="swap">⇄</button>
    <span class="arrow" id="arrow">→</span>
    <div class="lang-group" id="dstGroup">
      <button class="lang-btn active" data-lang="en">English</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-label" id="srcLabel">SOURCE</div>
      <textarea id="inputText" placeholder="Input text…" spellcheck="false"></textarea>
      <div class="panel-footer">
        <span class="char-count" id="charIn">0</span>
        <button class="copy-btn" id="copyIn">COPY</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-label" id="dstLabel">TRANSLATION</div>
      <textarea id="outputText" placeholder="Result…" readonly spellcheck="false"></textarea>
      <div class="panel-footer">
        <span class="char-count" id="charOut">0</span>
        <button class="copy-btn" id="copyOut">COPY</button>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="translate-btn" id="translateBtn">TRANSLATE →</button>
    <span class="status" id="status">Ready — Qwen 1.5B local model</span>
  </div>
</main>

<footer>powered by Qwen2.5-1.5B · llama.cpp · running locally on Intel Mac</footer>

<script>
const STORAGE_KEY = 'translator_access_key';
const state = { src: 'zh', dst: 'en', busy: false, key: '' };

// ── Gate ──────────────────────────────────────────────────
const gate     = document.getElementById('gate');
const pwInput  = document.getElementById('pwInput');
const gateBtn  = document.getElementById('gateBtn');
const gateError = document.getElementById('gateError');

async function tryUnlock(pw) {
  gateError.textContent = '';
  gateBtn.textContent = 'CHECKING…';
  gateBtn.disabled = true;

  // 用密码试调一次 API，让后端来验证
  try {
    const res = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Key': pw },
      body: JSON.stringify({ text: 'test', source: 'en', target: 'zh' }),
    });
    if (res.status === 401) {
      pwInput.classList.add('error');
      gateError.textContent = '✗ Incorrect access key';
    } else {
      // 正确 — 保存并进入
      localStorage.setItem(STORAGE_KEY, pw);
      state.key = pw;
      gate.classList.add('hidden');
      pwInput.classList.remove('error');
    }
  } catch {
    gateError.textContent = '✗ Service unreachable — check if local model is running';
  }

  gateBtn.textContent = 'ENTER →';
  gateBtn.disabled = false;
}

gateBtn.addEventListener('click', () => tryUnlock(pwInput.value.trim()));
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(pwInput.value.trim()); });

// LOCK ボタン
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  state.key = '';
  pwInput.value = '';
  gate.classList.remove('hidden');
});

// 起動時にキャッシュされたキーで自動アンロック試行
const cachedKey = localStorage.getItem(STORAGE_KEY);
if (cachedKey) tryUnlock(cachedKey);

// ── Lang groups ───────────────────────────────────────────
const LANG_NAMES = { zh: '中文', ja: '日本語', en: 'English' };

function setupGroup(groupId, key) {
  document.getElementById(groupId).addEventListener('click', e => {
    const btn = e.target.closest('.lang-btn');
    if (!btn) return;
    document.querySelectorAll(`#${groupId} .lang-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state[key] = btn.dataset.lang;
    updateLabels();
    scheduleTranslate();
  });
}
setupGroup('srcGroup', 'src');
setupGroup('dstGroup', 'dst');

function updateLabels() {
  document.getElementById('srcLabel').textContent = `SOURCE — ${LANG_NAMES[state.src]}`;
  document.getElementById('dstLabel').textContent = `TRANSLATION — ${LANG_NAMES[state.dst]}`;
  document.getElementById('arrow').textContent = `${LANG_NAMES[state.src]} → ${LANG_NAMES[state.dst]}`;
}

// ── Swap ──────────────────────────────────────────────────
document.getElementById('swapBtn').addEventListener('click', () => {
  [state.src, state.dst] = [state.dst, state.src];
  ['srcGroup','dstGroup'].forEach((gid, i) => {
    const lang = i === 0 ? state.src : state.dst;
    document.getElementById(gid).querySelectorAll('.lang-btn')
      .forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  });
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  [inputText.value, outputText.value] = [outputText.value, inputText.value];
  updateCharCount();
  updateLabels();
  scheduleTranslate();
});

// ── Translate ─────────────────────────────────────────────
const inputText    = document.getElementById('inputText');
const outputText   = document.getElementById('outputText');
const translateBtn = document.getElementById('translateBtn');
const statusEl     = document.getElementById('status');

async function doTranslate() {
  const text = inputText.value.trim();
  if (!text || state.busy) return;
  if (state.src === state.dst) { outputText.value = text; return; }

  state.busy = true;
  translateBtn.disabled = true;
  translateBtn.textContent = 'TRANSLATING…';
  setStatus('loading', '⟳ translating…');
  outputText.value = '';

  try {
    const res = await fetch('/api/translate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Access-Key': state.key,
      },
      body: JSON.stringify({ text, source: state.src, target: state.dst }),
    });

    if (res.status === 401) {
      setStatus('error', '✗ Session expired — please re-enter access key');
      localStorage.removeItem(STORAGE_KEY);
      state.key = '';
      gate.classList.remove('hidden');
      return;
    }

    const data = await res.json();
    if (data.translation) {
      outputText.value = data.translation;
      updateCharCount();
      setStatus('ok', '✓ done');
    } else {
      setStatus('error', `✗ ${data.error || 'Unknown error'}`);
    }
  } catch (err) {
    setStatus('error', `✗ ${err.message}`);
  } finally {
    state.busy = false;
    translateBtn.disabled = false;
    translateBtn.textContent = 'TRANSLATE →';
  }
}

translateBtn.addEventListener('click', doTranslate);
inputText.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') doTranslate(); });

let autoTimer = null;
function scheduleTranslate() {
  clearTimeout(autoTimer);
  if (inputText.value.trim()) autoTimer = setTimeout(doTranslate, 1000);
}
inputText.addEventListener('input', () => { updateCharCount(); scheduleTranslate(); });

// ── Utils ─────────────────────────────────────────────────
function updateCharCount() {
  document.getElementById('charIn').textContent  = inputText.value.length;
  document.getElementById('charOut').textContent = outputText.value.length;
}
function setStatus(cls, msg) {
  statusEl.className = `status ${cls}`;
  statusEl.textContent = msg;
}
function setupCopy(btnId, getVal) {
  document.getElementById(btnId).addEventListener('click', async () => {
    const t = getVal(); if (!t) return;
    try { await navigator.clipboard.writeText(t); } catch {}
    const btn = document.getElementById(btnId);
    btn.textContent = 'COPIED ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1500);
  });
}
setupCopy('copyIn',  () => inputText.value);
setupCopy('copyOut', () => outputText.value);

updateLabels();
updateCharCount();
</script>
</body>
</html>
